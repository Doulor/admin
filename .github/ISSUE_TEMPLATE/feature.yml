name: 需求 / 改进
description: 提一个功能需求或改进。提交前请先按 docs/conventions/ISSUES.md §1 查重。
title: "<模块>：<用户可见的诉求>"
labels: ["enhancement", "P2"]
body:
  - type: markdown
    attributes:
      value: |
        **提交前必做**：按 [docs/conventions/ISSUES.md](../../docs/conventions/ISSUES.md) §1 完整读取开放 issue 列表与已关闭 issue，确认不是重复。

        标题格式固定为 `<模块>：<用户可见的诉求>`。**描述问题与期望，不要写实现方案** —— 方案放 PR。

  - type: dropdown
    id: site
    attributes:
      label: 端（主端）
      description: 需要在哪个端实施或验收。跨端时在描述里补充其它端。
      options:
        - portal
        - forum
        - admin
        - server
        - shared
        - deploy
        - docs
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: |
        P0 = 阻断全员开发。
        P1 = 已明确排期的重要功能。
        P2 = 常规需求与优化。
        不确定时宁可低一档。
      options:
        - P2
        - P1
        - P0
    validations:
      required: true

  - type: dropdown
    id: change_type
    attributes:
      label: 改动类型
      description: |
        至少选一个，跨类就都选（判定口径见 docs/conventions/ISSUES.md §2）。
        ui = 线上界面看得到的；func = 接口、权限、数据、外部服务的行为；infra = 部署、CI、脚本、文档。
        选 ui:* 必须在下面「截图证明」里放图；选 func:* 必须填「涉及接口」。
      multiple: true
      options:
        - ui:layout — 版式、响应式、溢出、竖屏适配
        - ui:visual — 配色、字体、图标、动画、3D 观感
        - ui:interaction — 手势、键盘、焦点、触控目标、无障碍
        - ui:content — 界面文案与可见内容
        - func:api — 路由、请求响应约定、错误码、限流
        - func:auth — 登录、会话、角色与权限
        - func:data — 表结构、迁移、导入导出、存储
        - func:external — GitHub、发信商、CDN 等外部服务对接
        - infra:deploy — 镜像、compose、环境变量契约、部署
        - infra:ci — 工作流、检查脚本、钩子
        - infra:tooling — 脚本、规范文档、测试基建
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 相关 issue
      description: |
        查过开放与已关闭的 issue 后填：`#n` 加关系（重复 / 续作 / 部分重叠），或写「已搜关键词 X、Y，无相关」。
        处理办法见 docs/conventions/ISSUES.md §2「相关 issue」。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图证明
      description: 选了 ui:* 必填。直接拖进编辑框上传现状截图或录屏，注明视口与设备；没有选 ui:* 可留空。
    validations:
      required: false

  - type: textarea
    id: interfaces
    attributes:
      label: 涉及接口
      description: |
        选了 func:* 必填。写方法 + 路径（如 `POST /api/forum/topics`）、请求响应约定、要补的接口测试和验证方式。
        没有接口变化写「无接口变更：<理由>」。
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 现状与问题
      description: 现在是什么样，为什么不够用。不要写实现方案。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
      description: 希望用户能看到 / 能做什么。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围与不做什么
      description: 这次包括什么、明确不包括什么；涉及的接口、权限、数据。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 怎样算完成：可观察的结果，以及要在哪些尺寸 / 设备 / 环境看。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
      description: 可选。说明为什么不采用。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已按 docs/conventions/ISSUES.md §1 查重（含已关闭 issue）
          required: true
        - label: 描述的是问题与期望，不是实现方案
          required: true
